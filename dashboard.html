<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Barbearia Caravela · Agenda</title>
<style>
  :root{
    --accent:#7c2430;
    --bg:#f4f2ed; --surface:#fff; --surface-2:#ece9e1; --border:#dcd8cd; --grid:#e8e5dc;
    --text:#23211d; --soft:#5f5c53; --faint:#8b887d;
    --novo:#b4540a; --novo-bg:#fbe9d6;
    --ok:#2f6f5e; --ok-bg:#dcede6;
    --done:#6b6a63; --done-bg:#e6e4dd;
    --bad:#a23b2e; --bad-bg:#f3dedb;
    --chegou:#1d5fa8; --chegou-bg:#e0ecf8;
    --radius:12px; --rowh:44px;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#171614; --surface:#22201d; --surface-2:#2c2a26; --border:#3a3730; --grid:#2e2c27;
      --text:#eceae2; --soft:#b6b3a7; --faint:#8b887b;
      --novo:#f0a25c; --novo-bg:#3b2a18;
      --ok:#6fc2a8; --ok-bg:#1f342d;
      --done:#a9a89f; --done-bg:#2d2b28;
      --bad:#e58a7c; --bad-bg:#3b2421;
      --chegou:#7db4ec; --chegou-bg:#1d2d40;
      --accent:#c2586a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);line-height:1.4;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input,select,textarea{font:inherit;width:100%;padding:.65rem .75rem;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text)}
  label{display:block;font-size:.76rem;font-weight:650;color:var(--soft);margin:0 0 .3rem}
  [hidden]{display:none!important}
  .btn{border:1px solid var(--border);background:var(--surface);padding:.6rem .95rem;border-radius:10px;font-weight:600}
  .btn:hover{background:var(--surface-2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent);filter:brightness(.9)}
  .btn-ghost{border-color:transparent;background:transparent;color:var(--soft)}
  .btn-danger{color:var(--bad)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .login{min-height:100dvh;display:grid;place-items:center;padding:1.25rem}
  .login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.5rem;display:flex;flex-direction:column;gap:1rem}
  #login-flow{display:flex;flex-direction:column;gap:1rem}
  .login-card h1{margin:0;font-size:1.3rem}
  .login-card p{margin:0;color:var(--soft);font-size:.9rem}
  .err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:.6rem .8rem;font-size:.88rem}

  .top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border)}
  .top-in{max-width:1100px;margin:0 auto;padding:.65rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.8rem}
  .biz{font-weight:700}
  .live{display:inline-flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--faint)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  .live.on{color:var(--ok)} .live.on .dot{background:var(--ok)}

  main{max-width:1100px;margin:0 auto;padding:1rem 1rem 6rem}
  .datebar{display:flex;align-items:center;gap:.5rem;margin-bottom:.9rem}
  .datebar .label{flex:1;text-align:center;font-weight:700;font-size:1.05rem;text-transform:capitalize;cursor:pointer}
  .datebar .label small{display:block;font-weight:500;color:var(--faint);font-size:.76rem;text-transform:none}
  .icon{width:44px;height:44px;padding:0;display:grid;place-items:center;font-size:1.1rem}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin-bottom:.9rem}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.65rem .8rem}
  .stat b{display:block;font-size:1.35rem;line-height:1.15;font-variant-numeric:tabular-nums}
  .stat span{font-size:.74rem;color:var(--soft)}
  .stat.hot b{color:var(--novo)}
  .banner{background:var(--surface-2);border-radius:10px;padding:.5rem .8rem;font-size:.85rem;color:var(--soft);margin-bottom:.9rem}

  .tools{display:flex;gap:.5rem;align-items:center;justify-content:space-between;margin-bottom:.7rem;flex-wrap:wrap}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .seg button{border:0;background:var(--surface);padding:.45rem .9rem;font-weight:600;font-size:.88rem}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}

  /* agenda */
  .agenda{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;max-height:calc(100dvh - 300px);min-height:360px}
  .ag-grid{display:grid;position:relative;min-width:min-content}
  .ag-head{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);padding:.55rem .5rem;font-weight:700;font-size:.9rem;text-align:center}
  .ag-head small{display:block;font-weight:500;color:var(--faint);font-size:.72rem}
  .ag-head.corner{left:0;z-index:7}
  .gutter{position:sticky;left:0;z-index:4;background:var(--surface);border-right:1px solid var(--border)}
  .gutter .h{height:var(--rowh);font-size:.72rem;color:var(--faint);text-align:right;padding:.15rem .4rem 0;font-variant-numeric:tabular-nums;border-top:1px solid var(--grid)}
  .col{position:relative;border-left:1px solid var(--grid);min-width:150px;cursor:cell}
  .col .line{height:var(--rowh);border-top:1px solid var(--grid)}
  .col .line.half{border-top-style:dashed}
  .blk{position:absolute;left:3px;right:3px;border-radius:8px;padding:.25rem .45rem;overflow:hidden;font-size:.8rem;line-height:1.25;cursor:pointer;border-left:4px solid var(--novo);background:var(--novo-bg);color:var(--text)}
  .blk b{display:block;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .blk span{color:var(--soft);font-size:.74rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .blk.confirmado{border-left-color:var(--ok);background:var(--ok-bg)}
  .blk.concluido{border-left-color:var(--done);background:var(--done-bg);opacity:.75}
  .blk.faltou,.blk.cancelado{border-left-color:var(--bad);background:var(--bad-bg);opacity:.6;text-decoration:line-through}
  .blk.chegou{border-left-color:var(--chegou);background:var(--chegou-bg)}
  .blk.fresh{animation:flash 2.4s ease-out}
  @keyframes flash{0%{box-shadow:0 0 0 3px var(--novo)}100%{box-shadow:0 0 0 0 transparent}}
  .blk.lock{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 6px,transparent 6px,transparent 12px);border-left:4px solid var(--faint);color:var(--soft)}
  .nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--bad);z-index:3;pointer-events:none}

  /* lista */
  .list{display:flex;flex-direction:column;gap:.6rem}
  .item{display:grid;grid-template-columns:62px 1fr auto;gap:.8rem;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem .9rem;cursor:pointer;text-align:left;width:100%}
  .item .t{font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
  .item .w{font-weight:650}
  .item .m{color:var(--soft);font-size:.85rem}
  .item.concluido,.item.cancelado,.item.faltou{opacity:.6}
  .pill{font-size:.7rem;font-weight:700;padding:.15rem .55rem;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
  .pill.novo{background:var(--novo-bg);color:var(--novo)}
  .pill.confirmado{background:var(--ok-bg);color:var(--ok)}
  .pill.concluido{background:var(--done-bg);color:var(--done)}
  .pill.faltou,.pill.cancelado{background:var(--bad-bg);color:var(--bad)}
  .pill.chegou{background:var(--chegou-bg);color:var(--chegou)}
  .empty{text-align:center;color:var(--faint);padding:3rem 1rem}

  .fabs{position:fixed;right:1rem;bottom:1rem;z-index:20;display:flex;gap:.5rem}
  .fabs .btn{box-shadow:0 6px 20px rgba(0,0,0,.25);border-radius:999px;padding:.8rem 1.2rem}
  /* resumo */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin-bottom:1rem}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.8rem .9rem}
  .kpi b{display:block;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
  .kpi span{font-size:.76rem;color:var(--soft)}
  .kpi.big b{color:var(--ok)}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:1rem}
  .panel h3{margin:0 0 .15rem;font-size:1rem}
  .panel .sub{color:var(--soft);font-size:.84rem;margin-bottom:.8rem}
  .chart{width:100%;height:auto;display:block}
  .chart text{fill:var(--soft);font-size:11px;font-variant-numeric:tabular-nums}
  .chart .peak-l{fill:var(--accent);font-weight:700}
  .chart .grid{stroke:var(--grid);stroke-width:1}
  .chart .bar{fill:var(--surface-2);stroke:var(--border)}
  .chart .bar.peak{fill:var(--accent);stroke:var(--accent)}
  .rows{display:flex;flex-direction:column}
  .rrow{display:grid;grid-template-columns:54px 1fr auto;gap:.7rem;padding:.55rem 0;border-top:1px solid var(--grid);align-items:center;font-size:.9rem}
  .rrow:first-child{border-top:0}
  .rrow .t{font-weight:700;font-variant-numeric:tabular-nums}
  .rrow .m{color:var(--soft);font-size:.8rem}
  .rrow .p{font-weight:700;font-variant-numeric:tabular-nums}
  .why{color:var(--bad);font-size:.8rem;font-weight:600}
  .bybar{display:flex;flex-direction:column;gap:.45rem}
  .bybar .r{display:grid;grid-template-columns:80px 1fr 64px;gap:.6rem;align-items:center;font-size:.86rem}
  .bybar .track{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
  .bybar .fill{height:100%;background:var(--accent);border-radius:6px}
  .bybar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
  .chips{display:flex;gap:.5rem;overflow-x:auto;margin-bottom:.9rem}
  .chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:.4rem .9rem;font-size:.86rem;font-weight:600;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .rep{background:var(--bad-bg);color:var(--bad);font-size:.68rem;font-weight:700;padding:.1rem .45rem;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;margin-left:.4rem}
  .lnk a{color:var(--accent);font-weight:650;font-size:.84rem;text-decoration:none;margin-right:.8rem}
  .cnt{font-size:.78rem;color:var(--soft)}
  .toast{position:fixed;left:50%;top:66px;transform:translateX(-50%);z-index:60;background:var(--novo);color:#fff;border-radius:999px;padding:.55rem 1.1rem;font-weight:650;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw}

  dialog{border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text);padding:0;width:min(440px,94vw)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .form{padding:1.2rem;display:flex;flex-direction:column;gap:.8rem}
  .form h2{margin:0;font-size:1.1rem}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
  .form-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:.3rem;flex-wrap:wrap}
  .det .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
  .det .links a{color:var(--accent);font-weight:650;text-decoration:none;margin-right:1rem}
  .det .k{color:var(--soft);font-size:.9rem}
</style>
</head>
<body>

<!-- ============ CONFIGURAÇÃO DO CLIENTE (o único bloco a editar) ============ -->
<script>
window.DASH_CONFIG = {
  businessName: 'Barbearia Caravela', accent: '#7c2430',
  open: '09:00', close: '19:30', slot: 30, closedDows: [0, 1],
  barbers: [{"id": "vasco", "name": "Vasco"}, {"id": "filipe", "name": "Filipe"}, {"id": "lagu", "name": "Lagu"}],
  services: [{"name": "Corte de Cabelo", "min": 30, "price": 15}, {"name": "Corte Pente Único", "min": 30, "price": 10}, {"name": "Barba", "min": 30, "price": 8}, {"name": "Barba com Lâmina", "min": 30, "price": 12}, {"name": "Corte + Barba", "min": 60, "price": 20}, {"name": "Corte + Barba com Lâmina", "min": 60, "price": 25}, {"name": "Design de Sobrancelhas", "min": 15, "price": 5}, {"name": "Massagem Capilar", "min": 15, "price": 8}],
  reasons: ["Cliente não apareceu", "Cliente cancelou", "Cliente desmarcou em cima da hora", "Barbeiro indisponível", "Outro motivo"],
  supabaseUrl: '', supabaseKey: ''
};
</script>

<section class="login" id="login" hidden>
  <div class="login-card">
    <h1 id="login-title">Agenda</h1>
    <div id="login-flow"></div>
  </div>
</section>

<div id="app" hidden>
  <header class="top"><div class="top-in">
    <span class="biz" id="biz"></span>
    <span style="display:flex;align-items:center;gap:.8rem">
      <span class="live" id="live"><span class="dot"></span><span id="live-txt">a ligar</span></span>
      <button class="btn btn-ghost" id="logout" style="padding:.4rem .6rem">Sair</button>
    </span>
  </div></header>
  <main>
    <div class="banner" id="demo-note" hidden>Pré-visualização com dados de exemplo — ainda não está ligada às marcações reais (a Caravela usa o BUK). Mostra o que o painel Tá-se Bem pode oferecer.</div>
    <div class="datebar">
      <button class="btn icon" id="prev" aria-label="Dia anterior">‹</button>
      <div class="label" id="datelabel" title="Voltar a hoje"></div>
      <button class="btn icon" id="next" aria-label="Dia seguinte">›</button>
    </div>
    <div class="banner" id="closed-note" hidden></div>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Vista">
        <button id="v-agenda" aria-pressed="true">Agenda</button>
        <button id="v-lista" aria-pressed="false">Lista</button>
        <button id="v-resumo" aria-pressed="false">Resumo</button>
        <button id="v-faltas" aria-pressed="false">Faltas</button>
        <button id="v-cliente" aria-pressed="false">Cliente</button>
      </div>
      <span class="live" id="hint" style="color:var(--faint)">Toca num espaço vazio para marcar</span>
    </div>
    <div id="view"></div>
  </main>
  <div class="fabs">
    <button class="btn" id="block">Bloquear</button>
    <button class="btn btn-primary" id="add">+ Marcação</button>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<dialog id="dlg-add"><form class="form" id="add-form" method="dialog">
  <h2>Nova marcação</h2>
  <div class="two">
    <div><label for="a-barber" id="a-barber-l">Barbeiro</label><select id="a-barber"></select></div>
    <div><label for="a-service">Serviço</label><select id="a-service"></select></div>
  </div>
  <div class="two">
    <div><label for="a-date">Dia</label><input id="a-date" type="date" required></div>
    <div><label for="a-time">Hora</label><input id="a-time" type="time" step="900" required></div>
  </div>
  <div class="two">
    <div><label for="a-name">Nome</label><input id="a-name" required></div>
    <div><label for="a-phone">Telemóvel</label><input id="a-phone" type="tel" inputmode="tel" required></div>
  </div>
  <div><label for="a-notes">Notas</label><input id="a-notes"></div>
  <div class="form-actions"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary">Guardar</button></div>
</form></dialog>

<dialog id="dlg-det"><div class="form det" id="det"></div></dialog>

<dialog id="dlg-receipt"><div class="form" id="receipt-body"></div></dialog>

<dialog id="dlg-block"><form class="form" id="block-form" method="dialog">
  <h2>Bloquear tempo</h2>
  <div class="two">
    <div><label for="b-barber">Quem</label><select id="b-barber"></select></div>
    <div><label for="b-date">Dia</label><input id="b-date" type="date" required></div>
  </div>
  <div><label><input type="checkbox" id="b-all" style="width:auto"> Dia inteiro (folga)</label></div>
  <div class="two" id="b-times">
    <div><label for="b-from">Das</label><input id="b-from" type="time" step="900" value="13:00"></div>
    <div><label for="b-to">Às</label><input id="b-to" type="time" step="900" value="14:00"></div>
  </div>
  <div><label for="b-reason">Motivo</label><input id="b-reason" placeholder="Almoço, folga, consulta..."></div>
  <div class="form-actions"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary">Bloquear</button></div>
</form></dialog>

<script>
(function(){
  'use strict';
  var CFG = window.DASH_CONFIG;
  document.documentElement.style.setProperty('--accent', CFG.accent || '#7c2430');
  document.title = CFG.businessName + ' · Agenda';

  var L = Object.assign({ pro:'Barbeiro', proLower:'barbeiro', done:'Cortes completos', doneNone:'Ainda nenhum corte concluído.', doneOnly:'Só cortes concluídos', closed:'Dia de descanso da barbearia.' }, CFG.labels || {});
  var STATUS = { novo:'Novo', confirmado:'Confirmado', chegou:'Cliente chegou', concluido:'Concluído', faltou:'Faltou', cancelado:'Cancelado' };
  var SLOT = CFG.slot || 30;

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function parseYmd(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function toMin(t){ var p = String(t||'0:0').split(':'); return (+p[0])*60 + (+p[1]||0); }
  function toTime(m){ return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); }
  function digits(s){ var d = String(s||'').replace(/\D/g,''); if (d.length > 9 && d.indexOf('351') === 0) d = d.slice(3); return d; }
  function barberName(id){ if (id === '*') return 'Todos'; var b = CFG.barbers.find(function(x){ return x.id === id; }); return b ? b.name : id; }
  var OPEN = toMin(CFG.open), CLOSE = toMin(CFG.close);
  function eur(n){ return (Math.round((+n||0)*100)/100).toLocaleString('pt-PT', { minimumFractionDigits: (n % 1 ? 2 : 0), maximumFractionDigits:2 }) + ' €'; }
  function priceOf(m){ return +m.price || 0; }

  /* ---------- dados ---------- */
  function supabaseStore(){
    var sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey), ch = null;
    function ok(r){ if (r.error) throw r.error; return r.data; }
    return {
      demo:false,
      session: function(){ return sb.auth.getSession().then(function(r){ return !!(r.data && r.data.session); }); },
      login: function(phone, pin){ return sb.auth.signInWithPassword({ email: digits(phone) + '@dono.tasebem.pt', password: pin }).then(function(r){ if (r.error) throw new Error('Telemóvel ou PIN errado.'); }); },
      logout: function(){ if (ch) sb.removeChannel(ch); return sb.auth.signOut(); },
      list: function(date){
        return Promise.all([ sb.from('marcacoes').select('*').eq('date', date), sb.from('bloqueios').select('*').eq('date', date) ])
          .then(function(r){ return { m: ok(r[0]) || [], b: ok(r[1]) || [] }; });
      },
      listRange: function(from, to){
        return sb.from('marcacoes').select('*').gte('date', from).lte('date', to).then(function(r){ return ok(r) || []; });
      },
      insertM: function(row){ return sb.from('marcacoes').insert(row).select().then(function(r){ return ok(r)[0]; }); },
      updateM: function(id, p){ return sb.from('marcacoes').update(p).eq('id', id).select().then(function(r){ return ok(r)[0]; }); },
      insertB: function(row){ return sb.from('bloqueios').insert(row).select().then(function(r){ return ok(r)[0]; }); },
      deleteB: function(id){ return sb.from('bloqueios').delete().eq('id', id).then(function(r){ if (r.error) throw r.error; }); },
      subscribe: function(cb, st){
        ch = sb.channel('agenda-live')
          .on('postgres_changes', { event:'*', schema:'public', table:'marcacoes' }, function(p){ cb('m', p.eventType, p.eventType === 'DELETE' ? p.old : p.new); })
          .on('postgres_changes', { event:'*', schema:'public', table:'bloqueios' }, function(p){ cb('b', p.eventType, p.eventType === 'DELETE' ? p.old : p.new); })
          .subscribe(function(s){ st(s === 'SUBSCRIBED'); });
      }
    };
  }

  function demoStore(){
    var L = null, seq = 0, today = ymd(new Date()), M = [], B = [];
    var names = ['Pedro Alves','Miguel Costa','Hugo Ramos','Diogo Silva','Bruno Neves','André Matos','Rafael Dias'];
    function nid(){ return 'd' + (++seq); }

  /* ---------- estado ---------- */
  var store, S = { date: ymd(new Date()), m: [], b: [], view: 'agenda', fresh: {}, period: 'dia', range: [], fperiod: '30', ffilter: 'todos', frows: [] }, mine = {};

  /* ---------- faltas e cancelamentos: quem não apareceu e quem cancelou ---------- */

  function hourChart(rows){
    var h0 = Math.floor(OPEN/60), h1 = Math.ceil(CLOSE/60) - 1, hours = [], counts = {};
    for (var h = h0; h <= h1; h++) { hours.push(h); counts[h] = 0; }
    rows.forEach(function(m){ var h = Math.floor(toMin(m.time)/60); if (h in counts) counts[h]++; });
    var max = Math.max.apply(null, hours.map(function(h){ return counts[h]; }));
    var nice = Math.max(4, Math.ceil(max / 4) * 4), step = nice / 4;
    var W = 620, H = 230, L = 34, R = 8, T = 22, B = 30, iw = W - L - R, ih = H - T - B, bw = iw / hours.length;
    var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Clientes por hora">';
    for (var g = 0; g <= 4; g++) {
      var y = T + ih - (g * step / nice) * ih;
      svg += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + (g * step) + '</text>';
    }

      svg += '<rect class="bar' + (h === peakH ? ' peak' : '') + '" x="' + x + '" y="' + y + '" width="' + w + '" height="' + Math.max(bh, v ? 2 : 0) + '" rx="3"><title>' + h + 'h: ' + v + ' cliente' + (v === 1 ? '' : 's') + '</title></rect>';
      if (v) svg += '<text class="' + (h === peakH ? 'peak-l' : '') + '" x="' + (x + w/2) + '" y="' + (y - 5) + '" text-anchor="middle">' + v + '</text>';
      svg += '<text x="' + (x + w/2) + '" y="' + (H - 10) + '" text-anchor="middle">' + h + 'h</text>';
    });
    return { svg: svg + '</svg>', peak: peakH, max: max };

    }

    if (S.period === 'dia') {
      var sorted = function(a){ return a.slice().sort(function(x,y){ return toMin(x.time) - toMin(y.time); }); };
      html += '<div class="panel"><h3>' + esc(L.done) + '</h3><div class="sub">' + done.length + ' hoje, ' + esc(eur(profit)) + '.</div><div class="rows">' +

  /* ---------- separador Cliente: procurar telemóvel, ver o Cartão Caravela
     e confirmar o corte. Dados reais (tabelas customers/customer_history/
     pins do Supabase da Caravela) — a mesma lógica de fidelização do
     "Painel do Barbeiro" original do site (10 cortes = 1 grátis + sobe de
     nível: Normal → Dourado → Premium). */
  var CYCLE_LENGTH = 10;
  var TIER_ORDER = ['normal', 'gold', 'premium'];
  var TIER_LABELS = { normal: 'Normal', gold: 'Dourado', premium: 'Premium' };
  var TIER_PERKS = {
    normal: [],
    gold: ['Sobrancelhas grátis em todos os cortes'],
    premium: ['2€ de desconto em todos os serviços'],
  };
  function nextTier(tier){
    var i = TIER_ORDER.indexOf(tier); if (i === -1) i = 0;
    return TIER_ORDER[Math.min(i + 1, TIER_ORDER.length - 1)];
  }
  var CL = { phone:'', customer:null, hasPin:false, loading:false };

  function fetchClient(phone){
    return Promise.all([
      authSb.from('customers').select('*').eq('phone', phone).maybeSingle(),
      authSb.from('pins').select('pin_hash').eq('phone', phone).maybeSingle(),
    ]).then(function(res){
      if (res[0].error) throw res[0].error;
      if (res[1].error) throw res[1].error;
      CL.customer = res[0].data || null;
      CL.hasPin = !!(res[1].data && res[1].data.pin_hash);
    });
  }

  function confirmCorte(phone, name, oldTier, oldStamps){
    var newStamps = oldStamps + 1, freeCut = false, newTier = oldTier;
    if (newStamps >= CYCLE_LENGTH) { freeCut = true; newStamps = 0; newTier = nextTier(oldTier); }
    var btn = $('cl-confirm'); if (btn) btn.disabled = true;
    authSb.from('customers').upsert({ phone: phone, name: name, stamps: newStamps, tier: newTier })
      .then(function(r){ if (r.error) throw r.error; return authSb.from('customer_history').insert({ phone: phone, date: ymd(new Date()), service: 'corte', redeemed: freeCut }); })
      .then(function(r){ if (r.error) throw r.error; return fetchClient(phone); })
      .then(function(){
        var msg = 'Corte confirmado.';
        if (freeCut) { msg = 'Corte confirmado. 10º corte grátis aplicado!'; if (newTier !== oldTier) msg += ' Este cliente subiu para ' + TIER_LABELS[newTier] + '.'; }
        toast(msg); CL.loading = false; render();
        openCorteReceipt(phone, name, newStamps, newTier, freeCut);
      })
      .catch(function(){ toast('Não foi possível gravar agora. Tenta de novo.'); if (btn) btn.disabled = false; });
  }

  /* Confirmação do corte por WhatsApp/email, com o cartão de fidelização
     atualizado. Sem preço: esta tela não escolhe serviço nem valor, só
     confirma o carimbo. Não é uma fatura com valor fiscal. */
  function openCorteReceipt(phone, name, stamps, tier, freeCut){
    var perks = TIER_PERKS[tier] || [];
    var msg = 'Olá ' + name + ', obrigado pela visita à Barbearia Caravela!\n\n' +
      (freeCut ? '10º corte grátis aplicado! ' : '') +
      'Carimbos: ' + stamps + ' de ' + CYCLE_LENGTH + ' (10º grátis)\n' +
      'Nível: ' + TIER_LABELS[tier] + (perks.length ? ' — ' + perks.join(' + ') : '') +
      '\n\nAté à próxima!';
    var wa = 'https://wa.me/351' + digits(phone) + '?text=' + encodeURIComponent(msg);
    $('receipt-body').innerHTML =
      '<h2>Enviar confirmação ao cliente</h2>' +
      '<p style="color:var(--soft);font-size:.85rem;margin:0 0 1rem">Confirma o corte e o estado do Cartão Caravela. Não é uma fatura com valor fiscal.</p>' +
      '<a class="btn btn-primary" style="width:100%;display:block;box-sizing:border-box;text-align:center;text-decoration:none;margin-bottom:.6rem" href="' + wa + '" target="_blank" rel="noopener">Enviar por WhatsApp</a>' +
      '<div style="margin-bottom:.6rem"><label for="rc-email">Email do cliente (opcional)</label><input id="rc-email" type="email" placeholder="cliente@email.com"></div>' +
      '<button class="btn" id="rc-email-go" style="width:100%;margin-bottom:1rem">Enviar por email</button>' +
      '<button class="btn btn-ghost" id="rc-close" style="width:100%">Agora não</button>';
    $('rc-close').onclick = function(){ $('dlg-receipt').close(); };
    $('rc-email-go').onclick = function(){
      var email = $('rc-email').value.trim();
      if (!email) { toast('Escreve o email do cliente.'); return; }
      location.href = 'mailto:' + encodeURIComponent(email) + '?subject=' + encodeURIComponent('O teu Cartão Caravela') + '&body=' + encodeURIComponent(msg);
    };
    $('dlg-receipt').showModal();
  }

  function clientCardHtml(){
    var c = CL.customer, isNew = !c;
    var tier = (c && c.tier) || 'normal', stamps = c ? (c.stamps || 0) : 0;
    var perks = TIER_PERKS[tier] || [];
    var nameField = isNew
      ? '<p style="color:var(--novo);font-size:.85rem;margin:0 0 .6rem">Cliente novo. Pergunta o nome antes de começar o corte.</p>' +
        '<div style="margin-bottom:1rem;max-width:340px"><label for="cl-name">Nome do cliente</label><input id="cl-name" placeholder="Nome"></div>'
      : '';
    return nameField +
      '<div class="rows" style="margin-bottom:1rem;max-width:340px">' +
        '<div class="rrow" style="grid-template-columns:1fr auto"><span>Nome</span><span id="cl-nameval">' + esc((c && c.name) || 'Novo cliente') + '</span></div>' +
        '<div class="rrow" style="grid-template-columns:1fr auto"><span>Carimbos</span><span>' + stamps + ' de ' + CYCLE_LENGTH + ' (10º grátis)</span></div>' +
        '<div class="rrow" style="grid-template-columns:1fr auto"><span>Nível</span><span>' + esc(TIER_LABELS[tier]) + (perks.length ? ': ' + esc(perks.join(' + ')) : '') + '</span></div>' +
      '</div>' +
      '<div style="max-width:340px">' +
      '<button class="btn btn-primary" id="cl-confirm" style="width:100%;margin-bottom:1rem">Confirmar Corte</button>' +
      '<div style="margin-bottom:.6rem"><label for="cl-pin">' + (CL.hasPin ? 'Repor PIN (novo)' : 'Criar PIN para o cliente') + '</label><input id="cl-pin" type="tel" inputmode="numeric" maxlength="4" placeholder="4 dígitos"></div>' +
      '<button class="btn" id="cl-pin-go" style="width:100%;margin-bottom:1rem">' + (CL.hasPin ? 'Repor PIN' : 'Criar PIN') + '</button>' +
      '<button class="btn btn-ghost" id="cl-back" style="width:100%">‹ Procurar outro número</button>' +
      '</div>';
  }

  function bindClientCard(){
    var nameInput = $('cl-name');
    if (nameInput) nameInput.addEventListener('input', function(){ $('cl-nameval').textContent = nameInput.value.trim() || 'Novo cliente'; });
    $('cl-confirm').onclick = function(){
      var c = CL.customer;
      var name = nameInput ? nameInput.value.trim() : ((c && c.name) || '');
      if (!c && !name) { toast('Pergunta o nome do cliente antes de confirmar.'); return; }
      confirmCorte(CL.phone, name, (c && c.tier) || 'normal', c ? (c.stamps || 0) : 0);
    };
    $('cl-pin-go').onclick = function(){
      var pin = $('cl-pin').value.trim();
      if (!/^\d{4}$/.test(pin)) { toast('O PIN tem 4 dígitos.'); return; }
      hashPin(CL.phone, pin).then(function(hash){
        return authSb.from('pins').upsert({ phone: CL.phone, pin_hash: hash });
      }).then(function(r){ if (r.error) throw r.error; CL.hasPin = true; toast('PIN guardado. Dá este PIN ao cliente.'); })
        .catch(function(){ toast('Não consegui guardar o PIN.'); });
    };
    $('cl-back').onclick = function(){ CL = { phone:'', customer:null, hasPin:false, loading:false }; render(); };
  }

  function renderCliente(){
    var html = '<div class="panel"><h3>Confirmar Corte</h3><div class="sub">Procura o cliente pelo telemóvel para ver o Cartão Caravela e confirmar o corte.</div>';
    if (!CL.phone) {
      html += '<div style="max-width:340px"><label for="cl-phone">Telemóvel do cliente</label><input id="cl-phone" type="tel" inputmode="tel" placeholder="912 345 678"></div>' +
        '<button class="btn btn-primary" id="cl-go" style="margin-top:.8rem">Procurar Cliente</button>';
    } else if (CL.loading) {
      html += '<p style="color:var(--soft)">A procurar…</p>';
    } else {
      html += clientCardHtml();
    }
    html += '</div>';
    $('view').innerHTML = html;
    if (!CL.phone) {
      var input = $('cl-phone');
      var go = function(){
        var digits = input.value.replace(/\D/g, '');
        if (digits.length < 9) { toast('Escreve um número de telemóvel válido.'); return; }
        CL = { phone: digits, customer:null, hasPin:false, loading:true };
        render();
        fetchClient(digits).then(function(){ CL.loading = false; render(); })
          .catch(function(){ toast('Não consegui procurar agora. Tenta de novo.'); CL = { phone:'', customer:null, hasPin:false, loading:false }; render(); });
      };
      input.addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); });
      $('cl-go').onclick = go;
      input.focus();
    } else if (!CL.loading) {
      bindClientCard();
    }
  }

  /* sessão */
  function showApp(){
    $('login').hidden = true; $('app').hidden = false;
    $('biz').innerHTML = esc(CFG.businessName) + (loggedStaff ? ' <span style="font-weight:500;color:var(--faint);font-size:.8rem">· ' + esc(loggedStaff.name) + '</span>' : '');
    $('demo-note').hidden = !store.demo;
    load();
    store.subscribe(onEvent, function(on){ $('live').classList.toggle('on', on); $('live-txt').textContent = on ? 'Ao vivo' : 'Sem ligação'; });
    setInterval(function(){ if (!document.hidden) { if (!store.demo) load(); else render(); } }, 60000);
  }
  $('login-title').textContent = CFG.businessName;
  $('logout').onclick = function(){
    try { localStorage.removeItem('caravela_admin_session'); } catch(x){}
    loggedStaff = null;
    location.reload();
  };

  function boot(){
    authSb = window.supabase.createClient(REAL_SUPABASE_URL, REAL_SUPABASE_KEY);
    store = (CFG.supabaseUrl && CFG.supabaseKey && window.supabase) ? supabaseStore() : demoStore();
    var savedId = null; try { savedId = localStorage.getItem('caravela_admin_session'); } catch(x){}
    var restored = savedId && STAFF.find(function(s){ return s.id === savedId; });
    if (restored) { loggedStaff = restored; showApp(); return; }
    $('login').hidden = false;
    renderAuth();
  }
  var sbScript = document.createElement('script'); sbScript.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  sbScript.onload = boot; sbScript.onerror = function(){ alert('Não consegui carregar o Supabase.'); }; document.head.appendChild(sbScript);
})();
</script>
</body>
</html>
